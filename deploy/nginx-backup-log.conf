# 示例：map 与 log_format 放在 nginx 的 http {} 范围（通常 /etc/nginx/conf.d/ 可被该范围 include）。
# 不记录查询字符串、Referer 或完整的备份下载能力链接，保留路径类别、方法、状态和耗时。
map $uri $literacy_log_path {
    default $uri;
    ~^/api/ios-backups/ /api/ios-backups/[redacted];
}

log_format literacy_backup_safe
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $literacy_log_path $server_protocol" '
    '$status $body_bytes_sent $request_time';

# 在 z.allon.me 的 server {} 中，用下面一行替换该站点原 access_log，保留实际现有日志路径。
# 不要与原始 $request/$request_uri 日志同时启用，否则另一份日志仍会保存 token。
# access_log /var/log/nginx/z.allon.me.access.log literacy_backup_safe;

# 部署检查：nginx -t 后 reload；用合成链接请求一次，再核对只出现 [redacted]。
# 应用、代理错误日志、APM 等可能有独立的请求记录，需要同时检查其采集规则；
# 本示例仅控制 access_log，不修改上游代理、安全策略、错误日志或监控开关。
